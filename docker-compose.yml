services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodinsight
      POSTGRES_USER: foodinsight
      POSTGRES_PASSWORD: foodinsight
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodinsight -d foodinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
          test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
          interval: 10s
          timeout: 5s
          retries: 10
          start_period: 10s
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/foodinsight
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    profiles: ["graph"]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
