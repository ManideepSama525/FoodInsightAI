[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodinsightai-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0,<7.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "qdrant-client>=1.12",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "structlog>=24.4",
  "pytest>=8.3",
  "httpx>=0.27",
  "pillow>=10.4",
  "neo4j>=5.26,<6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


